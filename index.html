<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IntelProp — Cyprus Listings</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fff;--bg2:#f7f7f6;--bd:rgba(0,0,0,0.1);--tx:#1a1a1a;--mu:#888;--r:8px;--red:#e74c3c;--gold:#b8860b}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1c;--bg2:#252525;--bd:rgba(255,255,255,0.1);--tx:#f0f0f0;--mu:#777}}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg2);color:var(--tx);font-size:13px;min-height:100vh}
.shell{max-width:1200px;margin:0 auto;padding:24px 20px}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.logo{font-size:20px;font-weight:600;letter-spacing:-.5px}
.logo span{font-weight:300;color:var(--mu)}
.sub{font-size:12px;color:var(--mu);margin-top:3px}
.top-btns{display:flex;gap:6px}
.btn{font-size:12px;height:34px;padding:0 14px;border:1px solid var(--bd);border-radius:var(--r);background:var(--bg);color:var(--tx);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--bg2)}
.btn.primary{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.panel{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:16px}
.tabs{display:flex;border-bottom:1px solid var(--bd);margin-bottom:16px}
.tab{font-size:13px;padding:8px 16px;cursor:pointer;color:var(--mu);border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--tx)}
.tab.on{color:var(--tx);font-weight:500;border-bottom-color:var(--tx)}
.slbadge{display:inline-flex;align-items:center;justify-content:center;background:var(--red);color:#fff;font-size:10px;font-weight:600;border-radius:99px;min-width:15px;height:15px;padding:0 4px;margin-left:4px}
.frow{display:grid;grid-template-columns:1fr repeat(3,minmax(120px,160px));gap:8px;margin-bottom:10px}
.frow input,.frow select{font-size:12px;height:34px;padding:0 10px;border:1px solid var(--bd);border-radius:var(--r);background:var(--bg);color:var(--tx);width:100%}
.prow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.prow label{font-size:11px;color:var(--mu);white-space:nowrap;min-width:64px}
.prow input[type=range]{flex:1;accent-color:var(--tx)}
.sbar{display:flex;gap:20px;margin-bottom:12px;flex-wrap:wrap}
.stat{font-size:11px;color:var(--mu)}
.stat b{font-weight:500;color:var(--tx)}
.vt{display:flex;gap:4px;margin-bottom:12px}
.vtb{font-size:11px;height:28px;padding:0 10px;border:1px solid var(--bd);border-radius:var(--r);background:var(--bg);color:var(--mu);cursor:pointer}
.vtb.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.twrap{overflow-x:auto;border:1px solid var(--bd);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed;min-width:968px}
thead tr{background:var(--bg2)}
th{padding:9px 10px;text-align:left;font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.5px;color:var(--mu);border-bottom:1px solid var(--bd);white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--tx)}
td{padding:9px 10px;border-bottom:1px solid var(--bd);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
tr:hover td{background:var(--bg2)}
.hb{background:none;border:none;cursor:pointer;font-size:16px;color:#ccc;padding:0;line-height:1;transition:color .1s,transform .15s}
.hb:hover{transform:scale(1.3);color:var(--red)}
.hb.on{color:var(--red)}
.tag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:99px;font-weight:500}
.tf{background:#dbeafe;color:#1d4ed8}.th{background:#dcfce7;color:#15803d}.tv{background:#fef3c7;color:#92400e}.ta{background:#ede9fe;color:#6d28d9}.tp{background:#fce7f3;color:#9d174d}.to{background:#f3f4f6;color:#6b7280}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:28px;padding:4px}
.prop-card{background:var(--bg);border:1px solid var(--bd);border-radius:12px;overflow:visible;position:relative;transition:border-color .15s;cursor:pointer}
.prop-card:hover{border-color:rgba(0,0,0,.22)}
.card-img-wrap{border-radius:12px 12px 0 0;overflow:hidden;height:160px;background:var(--bg2)}
.card-img-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.card-body{padding:11px 13px 13px}
.card-heart{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.88);border:none;cursor:pointer;font-size:15px;color:#bbb;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;transition:color .1s,transform .15s;z-index:2}
.card-heart:hover{transform:scale(1.2);color:var(--red)}
.card-heart.on{color:var(--red)}
.card-title{font-size:12px;font-weight:500;color:var(--tx);margin-bottom:2px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-dev{font-size:11px;color:var(--mu);margin-bottom:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-facts{font-size:11px;color:var(--mu);margin-bottom:8px;line-height:1.7}
.card-price{font-size:15px;font-weight:600;color:var(--tx)}
.card-ppm{font-size:10px;color:var(--mu);margin-top:1px}
.rental-btn{width:100%;margin-top:10px;height:30px;font-size:11px;font-weight:500;border:1px solid var(--gold);border-radius:var(--r);background:transparent;color:var(--gold);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
.intel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;margin-bottom:16px}
.intel-card{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:16px}
.intel-card-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--mu);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.intel-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bd)}
.intel-row-label{font-size:12px;color:var(--tx);font-weight:500}
.intel-row-val{text-align:right}
.intel-row-main{font-size:13px;font-weight:600;color:var(--tx)}
.intel-badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:99px;font-weight:500}
.intel-high{background:#dcfce7;color:#15803d}
.intel-mid{background:#fef3c7;color:#92400e}
.intel-low{background:#fee2e2;color:#991b1b}
.intel-summary{background:var(--bg2);border-radius:10px;padding:14px 16px;margin-bottom:14px;font-size:12px;color:var(--tx);line-height:1.7;border:1px solid var(--bd)}
@media(max-width:680px){.frow{grid-template-columns:1fr 1fr}.shell{padding:16px 14px}}
</style>
</head>
<body>

<div class="modal-backdrop" id="modalBackdrop" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <button class="modal-close" onclick="closeModalDirect()">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<div class="shell">
  <div class="topbar">
    <div>
      <div class="logo">Intel<span>Prop</span></div>
      <div class="sub" id="sub">Loading data…</div>
    </div>
    <div class="top-btns">
      <button class="btn" onclick="exportCSV()">↓ CSV</button>
    </div>
  </div>

  <div class="panel">
    <div class="tabs">
      <button class="tab on" onclick="gotoTab('listings',this)">Listings</button>
      <button class="tab" onclick="gotoTab('map',this)">Map</button>
      <button class="tab" onclick="gotoTab('intelligence',this)">Intelligence</button>
      <button class="tab" onclick="gotoTab('clients',this)">Client Call</button>
      <button class="tab" onclick="gotoTab('portfolio',this)">Portfolio Builder</button>
      <button class="tab" onclick="gotoTab('developers',this)">Developers</button>
      <button class="tab" onclick="gotoTab('shortlist',this)">Shortlist <span class="slbadge" id="slBadge">0</span></button>
    </div>

    <!-- LISTINGS -->
    <div id="pListings">
      <div class="frow">
        <input type="text" id="q" placeholder="Search developer, title, district, complex, size…" oninput="doFilter()">
        <select id="fCity" onchange="doFilter()"><option value="">All cities</option></select>
        <select id="fType" onchange="doFilter()"><option value="">All types</option></select>
        <select id="fBeds" onchange="doFilter()"><option value="">Any beds</option></select>
      </div>
      <div style="display:flex;justify-content:flex-end;margin-bottom:8px">
        <button onclick="clearFilters()" style="font-size:11px;padding:3px 12px;border:1px solid var(--bd);border-radius:var(--r);background:none;color:var(--mu);cursor:pointer">✕ Clear all filters</button>
      </div>

      <div class="prow">
        <label>Max price</label>
        <input type="range" id="priceR" min="0" max="5000000" step="50000" value="5000000" oninput="onPrice()">
        <div style="display:flex;align-items:center;gap:3px;border:1px solid var(--bd);border-radius:var(--r);background:var(--bg);padding:0 8px;height:30px">
          <span style="font-size:12px;color:var(--mu)">€</span>
          <input type="number" id="priceInput" step="50000" oninput="onPriceInput()" style="width:90px;border:none;background:transparent;font-size:12px;color:var(--tx);outline:none">
        </div>
      </div>

      <div class="sbar">
        <div class="stat">Showing <b id="cShown">—</b> of <b id="cTotal">—</b></div>
        <div class="stat">Avg price <b id="aPrice">—</b></div>
        <div class="stat">Avg €/m² <b id="aPpm">—</b></div>
      </div>

      <div class="vt">
        <button class="vtb on" id="vTable" onclick="setView('table')">≡ Table</button>
        <button class="vtb" id="vCards" onclick="setView('cards')">⊞ Cards</button>
      </div>

      <div class="twrap" id="mainView"><div class="empty">Loading listings…</div></div>

      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:12px;flex-wrap:wrap;gap:8px">
        <div style="display:flex;align-items:center;gap:5px">
          <span style="font-size:11px;color:var(--mu)">Per page</span>
          <button class="vtb on" id="ps25" onclick="setPS(25)">25</button>
          <button class="vtb" id="ps50" onclick="setPS(50)">50</button>
          <button class="vtb" id="ps100" onclick="setPS(100)">100</button>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <button id="bPrev" onclick="pg(-1)" disabled>← Prev</button>
          <span id="pInfo" style="font-size:11px;color:var(--mu)"></span>
          <button id="bNext" onclick="pg(1)">Next →</button>
        </div>
      </div>
    </div>

    <!-- CLIENT CALL - FIXED -->
    <div id="pClients" style="display:none">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">
        <div>
          <div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--mu);margin-bottom:4px">Client name</div>
          <input type="text" id="cName" placeholder="e.g. David Cohen" style="width:100%;height:34px;padding:0 10px;border:1px solid var(--bd);border-radius:var(--r);background:var(--bg);color:var(--tx);font-size:12px">
        </div>
        <div>
          <div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--mu);margin-bottom:4px">Phone</div>
          <input type="text" id="cPhone" placeholder="+972 50 000 0000" style="width:100%;height:34px;padding:0 10px;border:1px solid var(--bd);border-radius:var(--r);background:var(--bg);color:var(--tx);font-size:12px">
        </div>
      </div>

      <!-- Purpose, Type, Budget, Beds, City, Sea, Delivery filters (kept minimal for space) -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:14px">
        <div>
          <div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--mu);margin-bottom:6px">Purpose</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap" id="cPurposeGroup">
            <button class="crit-btn" onclick="toggleCrit(this,'purpose');applyClientFilter()">Own use</button>
            <button class="crit-btn" onclick="toggleCrit(this,'purpose');applyClientFilter()">Short-term rental</button>
            <button class="crit-btn" onclick="toggleCrit(this,'purpose');applyClientFilter()">Long-term rental</button>
          </div>
        </div>
        <!-- Add more filter groups as needed from your original code -->
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:10px">
        <div style="font-size:12px;color:var(--mu)">
          Matching listings: <b id="cMatchCount" style="color:var(--tx)">—</b>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:11px;color:var(--mu)">Per page</span>
          <button class="vtb on" id="cPS25" onclick="setCPS(25)">25</button>
          <button class="vtb" id="cPS50" onclick="setCPS(50)">50</button>
          <button class="vtb" id="cPS100" onclick="setCPS(100)">100</button>
        </div>
        <button onclick="resetClient()" class="btn" style="font-size:11px">✕ Reset</button>
      </div>

      <div class="twrap" id="cResults"><div class="empty">Select criteria above to see matching listings.</div></div>
      <div id="cSaveStatus" style="font-size:11px;color:var(--mu);text-align:right;margin-top:8px"></div>
    </div>

    <!-- Other tabs (Map, Intelligence, Portfolio, Developers, Shortlist) are unchanged for brevity -->
    <!-- You can copy them from your original file if needed -->

  </div>
</div>

<script>
// ====================== CONFIG ======================
const ANTHROPIC_KEY = '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';
const SID = '1A4e51pB7O6BxYrXDAaWH2ZvjxLIQjiq-a2WpuhSs9dc';
const GID = '248082817';

// ====================== VARIABLES ======================
let PS = 25;
let all = [], filt = [], sl = new Set(), page = 1, sc = null, sa = true, view = 'table', tab = 'listings';

let cSortKey = null;
let cSortAsc = true;
let cPS = 25;
let cPage = 1;

const cCriteria = { purpose:null, budgetMin:null, budgetMax:null, types:[], beds:[], cities:[], maxSea:null, delivery:null };

// ====================== CORE FUNCTIONS (with fixes) ======================

function sortBy(k) {
  if (sc === k) sa = !sa;
  else { sc = k; sa = true; }
  doFilter();
}

function applyClientFilter(resetPage = true) {
  if (resetPage) cPage = 1;

  const results = all.filter(d => {
    if (cCriteria.budgetMin !== null && cCriteria.budgetMax !== null) {
      const p = d.price || 0;
      if (p < cCriteria.budgetMin || p > cCriteria.budgetMax) return false;
    }
    if (cCriteria.types.length > 0) {
      const t = (d.type || '').toLowerCase();
      if (!cCriteria.types.some(ct => t.includes(ct.toLowerCase()))) return false;
    }
    if (cCriteria.beds.length > 0) {
      const has5plus = cCriteria.beds.includes('5+');
      const numBeds = cCriteria.beds.filter(b => !isNaN(+b)).map(Number);
      const hasStudio = cCriteria.beds.includes('Studio');
      let match = false;
      if (hasStudio && (d.bedrooms === 0 || d.bedrooms === null)) match = true;
      if (numBeds.includes(d.bedrooms)) match = true;
      if (has5plus && d.bedrooms >= 5) match = true;
      if (!match) return false;
    }
    if (cCriteria.cities.length > 0) {
      if (!cCriteria.cities.some(c => (d.city || '').toLowerCase() === c.toLowerCase())) return false;
    }
    if (cCriteria.maxSea !== null && cCriteria.maxSea < 999) {
      if (d.seaDist == null || d.seaDist > cCriteria.maxSea) return false;
    }
    return true;
  });

  document.getElementById('cMatchCount').textContent = results.length.toLocaleString();

  if (!results.length) {
    document.getElementById('cResults').innerHTML = '<div class="empty">No listings match these criteria.</div>';
    return;
  }

  if (cSortKey) {
    results.sort((a, b) => {
      let av = cSortKey === 'yield' ? estimateYield(a, cCriteria.purpose || 'Long-term rental') : a[cSortKey];
      let bv = cSortKey === 'yield' ? estimateYield(b, cCriteria.purpose || 'Long-term rental') : b[cSortKey];
      if (av == null) av = cSortAsc ? Infinity : -Infinity;
      if (bv == null) bv = cSortAsc ? Infinity : -Infinity;
      if (typeof av === 'string') av = av.toLowerCase();
      if (typeof bv === 'string') bv = bv.toLowerCase();
      return cSortAsc ? (av > bv ? 1 : -1) : (av < bv ? 1 : -1);
    });
  }

  const start = (cPage - 1) * cPS;
  const top = results.slice(start, start + cPS);

  const rows = top.map(d => `
    <tr onclick="openModal(${d.id})" style="cursor:pointer">
      <td>${d.developer || '—'}</td>
      <td>${d.title || '—'}</td>
      <td>${tagBadge(d.type)}</td>
      <td>${d.city || '—'}</td>
      <td>${d.district || '—'}</td>
      <td style="text-align:center">${d.bedrooms != null ? d.bedrooms : '—'}</td>
      <td style="text-align:right">${d.area != null ? d.area.toLocaleString() + ' m²' : '—'}</td>
      <td style="font-weight:600">${d.price != null ? '€' + d.price.toLocaleString() : '—'}</td>
      <td style="text-align:right;font-weight:500;color:#15803d">
        ${estimateYield(d, cCriteria.purpose || 'Long-term rental').toFixed(1)}%
      </td>
      <td style="text-align:center">
        <button class="hb ${sl.has(d.id)?'on':''}" onclick="event.stopPropagation();heart(${d.id})">${sl.has(d.id)?'♥':'♡'}</button>
      </td>
    </tr>
  `).join('');

  const totalPages = Math.ceil(results.length / cPS) || 1;

  document.getElementById('cResults').innerHTML = `
    <table>
      <thead>
        <tr>
          <th onclick="sortClientBy('developer')">Developer ${getArrow('developer')}</th>
          <th onclick="sortClientBy('title')">Title ${getArrow('title')}</th>
          <th onclick="sortClientBy('type')">Type ${getArrow('type')}</th>
          <th onclick="sortClientBy('city')">City ${getArrow('city')}</th>
          <th onclick="sortClientBy('district')">District ${getArrow('district')}</th>
          <th onclick="sortClientBy('bedrooms')">Beds ${getArrow('bedrooms')}</th>
          <th onclick="sortClientBy('area')">Area ${getArrow('area')}</th>
          <th onclick="sortClientBy('price')">Price ${getArrow('price')}</th>
          <th onclick="sortClientBy('yield')">Est. Yield ${getArrow('yield')}</th>
          <th></th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:12px;flex-wrap:wrap;gap:8px">
      <div style="font-size:11px;color:var(--mu)">Page ${cPage} of ${totalPages} · ${results.length.toLocaleString()} listings</div>
      <div>
        <button onclick="cPg(-1)" ${cPage<=1?'disabled':''}>← Prev</button>
        <button onclick="cPg(1)" ${cPage>=totalPages?'disabled':''}>Next →</button>
      </div>
    </div>
  `;
}

function getArrow(key) {
  if (cSortKey !== key) return '↕';
  return cSortAsc ? '↑' : '↓';
}

function sortClientBy(key) {
  if (cSortKey === key) cSortAsc = !cSortAsc;
  else { cSortKey = key; cSortAsc = true; }
  applyClientFilter(false);
}

function setCPS(n) {
  cPS = n;
  [25,50,100].forEach(x => {
    const el = document.getElementById('cPS' + x);
    if (el) el.classList.toggle('on', x === n);
  });
  applyClientFilter();
}

function cPg(dir) {
  cPage += dir;
  applyClientFilter(false);
}

// Placeholder functions (add your full original logic here)
function estimateYield(d, purpose) {
  let y = 5.8;
  if ((d.type||'').toLowerCase().includes('apartment') || (d.type||'').toLowerCase().includes('flat')) y += 0.6;
  if (d.seaDist < 1) y += 0.8;
  if (purpose === 'Short-term rental') y += 1.2;
  return Math.max(4, Math.min(9.5, y));
}

function tagBadge(t) { /* your original tagBadge */ return `<span class="tag">${t}</span>`; }
function heart(id) { /* your original heart function */ }
function openModal(id) { /* your original openModal */ }
function gotoTab(t,el) { /* your original gotoTab */ }
function init() { /* your original init with data loading */ console.log("Init called"); }
// Add the rest of your original functions (doFilter, render, etc.) as needed

// Initialize the app
window.onload = init;
</script>
</body>
</html>
